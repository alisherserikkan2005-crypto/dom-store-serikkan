<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dom Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Dom Store</h1>

    <form id="add-form" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input id="name" type="text" autocomplete="off">
        <span class="error" id="name-error" aria-live="polite"></span>
      </div>
      <div class="field">
        <label for="price">Price</label>
        <input id="price" type="text" inputmode="decimal" autocomplete="off">
        <span class="error" id="price-error" aria-live="polite"></span>
      </div>
      <div class="field">
        <label for="qty">Qty</label>
        <input id="qty" type="text" inputmode="numeric" autocomplete="off">
        <span class="error" id="qty-error" aria-live="polite"></span>
      </div>
      <button type="submit">Add product</button>
    </form>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Name</th><th>Price</th><th>Qty</th><th>Sum</th><th></th></tr>
        </thead>
        <tbody id="product-list"></tbody>
      </table>
    </div>

    <p class="total">Total: <strong id="total" aria-live="polite">0 ₸</strong></p>
  </main>

  <script src="src/Store.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
